<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSC 4553 &middot; Operating Systems</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1c1c;
        --muted: #666666;
        --accent: #40666e;
        --card: #f5f6f7;
        --border: #e2e4e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181a;
          --fg: #ececec;
          --muted: #9aa0a6;
          --accent: #7fb3bd;
          --card: #202325;
          --border: #2e3235;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 3rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      main { max-width: 44rem; margin: 0 auto; }
      h1 { margin: 0; font-size: 2rem; letter-spacing: -0.01em; }
      .sub { margin: 0.35rem 0 0; color: var(--muted); }
      .links { margin-top: 0.75rem; }
      .links a { color: var(--accent); }
      ul { list-style: none; margin: 2rem 0 0; padding: 0; }
      .deck {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 1rem;
        margin-bottom: 0.6rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .deck-link {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 0.75rem;
        text-decoration: none;
        color: inherit;
        min-width: 0;
      }
      .deck-link:hover .day { text-decoration: underline; }
      .day { font-weight: 600; color: var(--accent); }
      .topic { color: var(--muted); }
      .pdf {
        flex: none;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-decoration: none;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0.2rem 0.5rem;
      }
      .pdf:hover { color: var(--accent); border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>CSC 4553</h1>
      <p class="sub">Operating Systems &middot; Fall 2026</p>
      <p class="links">
      <a href="syllabus.pdf">Syllabus</a>
      </p>
      <ul>
      <li class="deck">
        <a class="deck-link" href="day1.html">
          <span class="day">Day 1</span>
          <span class="topic">This class</span>
        </a>
        <a class="pdf" href="day1.pdf">PDF</a>
      </li>
      <li class="deck">
        <a class="deck-link" href="day2.html">
          <span class="day">Day 2</span>
          <span class="topic">OS abstractions</span>
        </a>
        <a class="pdf" href="day2.pdf">PDF</a>
      </li>
      <li class="deck">
        <a class="deck-link" href="day3.html">
          <span class="day">Day 3</span>
          <span class="topic">Boot chain</span>
        </a>
        <a class="pdf" href="day3.pdf">PDF</a>
      </li>
      </ul>
    </main>
  </body>
</html>
